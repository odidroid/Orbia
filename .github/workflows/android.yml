name: Gerar APK ORBIA

on:
  workflow_dispatch:
  push:
    branches: [feat/ia-local-foundation]

jobs:
  build:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Configurar assinatura fixa do ORBIA
        env:
          ORBIA_DEBUG_KEYSTORE_BASE64: ${{ secrets.ORBIA_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ORBIA_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::O segredo ORBIA_DEBUG_KEYSTORE_BASE64 não chegou ao workflow."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          umask 077

          # Remove espaços e quebras de linha que podem entrar ao copiar o Base64.
          KEYSTORE_BASE64="$(printf '%s' "$ORBIA_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')"

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"; then
            echo "::error::O segredo existe, mas não contém um Base64 válido. Gere novamente o texto Base64 no Termux e atualize o segredo do GitHub."
            rm -f "$HOME/.android/debug.keystore"
            exit 1
          fi

          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            echo "::error::O arquivo da chave foi criado vazio. Confira o conteúdo do segredo no GitHub."
            exit 1
          fi

          # Lista os aliases sem exibir dados privados da chave. Isso permite
          # distinguir senha/formato inválido de alias diferente do esperado.
          if ! KEYSTORE_INFO="$(keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android 2>&1)"; then
            echo "::error::O Base64 foi decodificado, mas o Java não conseguiu abrir o keystore. Diagnóstico do keytool:"
            printf '%s\\n' "$KEYSTORE_INFO"
            exit 1
          fi

          if ! printf '%s\\n' "$KEYSTORE_INFO" | grep -Fq 'androiddebugkey'; then
            echo "::error::O keystore abriu, mas não contém o alias androiddebugkey. Aliases encontrados:"
            printf '%s\\n' "$KEYSTORE_INFO" | grep -E '^[^,]+, ' || true
            exit 1
          fi

          echo "Assinatura fixa do ORBIA configurada e validada."

      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos do ORBIA
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar permissões Android
        run: node patch-android-manifest.js

      - name: Instalar plugin nativo da ORBIA IA
        run: node install-local-ai-plugin.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBIA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
