name: Testar ORBIA no emulador Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    name: Compilar, instalar e abrir no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma e ferramentas de compilação
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm ci

      - name: Preparar arquivos do ORBIA
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar permissões Android
        run: node patch-android-manifest.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK de teste
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Iniciar emulador e testar abertura do aplicativo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            mkdir -p test-results

            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"

            adb install -r "$APK"
            adb logcat -c

            adb shell monkey -p com.orbia.app 1
            sleep 25

            if ! adb shell pidof com.orbia.app >/dev/null; then
              echo "::error::O processo do ORBIA não permaneceu ativo após a abertura."
              adb logcat -d -t 5000 > test-results/logcat.txt
              exit 1
            fi

            adb exec-out screencap -p > test-results/orbia-home.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml test-results/window.xml

            adb logcat -d -t 5000 > test-results/logcat.txt

            if grep -A 12 "FATAL EXCEPTION" test-results/logcat.txt | grep -q "Process: com\\.orbia\\.app"; then
              echo "::error::Foi detectada uma exceção fatal no log do Android."
              exit 1
            fi

            echo "ORBIA instalado e permaneceu aberto no emulador."
            echo "Captura de tela, hierarquia de interface e logcat salvos."

      - name: Disponibilizar resultados dos testes (sem APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbia-android-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
